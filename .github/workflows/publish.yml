# Release workflow for the Go SDK (module `github.com/lockallyinc/lockally-go`).
#
# TEMPLATE — inert in this monorepo. Copy to `.github/workflows/release.yml`
# in the SDK's own repo (the generated `sdk/go/` tree, pushed to
# github.com/lockallyinc/lockally-go).
#
# Go needs NO registry and NO secret: a published git tag `vX.Y.Z` on a public
# repo is what makes `go get github.com/lockallyinc/lockally-go@vX.Y.Z` work (the
# module proxy fetches it on demand). This workflow just sanity-builds the
# tagged commit and cuts a GitHub Release for changelog/visibility.
name: Release (Go module)

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
